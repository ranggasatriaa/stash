# Stash — Nginx in front of PHP-FPM. TLS is terminated by a reverse proxy on
# the VPS (Caddy/Nginx/Traefik, see docs/DEPLOYMENT.md); this server speaks
# plain HTTP on the private Docker network / localhost only.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    client_max_body_size 16m;
    client_body_timeout 120s;

    # Never serve dotfiles, PHP sources other than the front controller, or storage.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(storage|vendor|\.env) { deny all; }

    # Hashed, immutable build assets.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # Larger bodies only for import uploads.
    location ~ ^/(settings/imports|api/v1/imports)$ {
        client_max_body_size 520m;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
