; Stash production PHP settings
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 512M
max_execution_time = 60
; Image uploads are limited to 10 MiB by the app (STASH_UPLOAD_MAX_BYTES);
; imports may be larger (STASH_IMPORT_MAX_BYTES, default 512 MiB).
upload_max_filesize = 520M
post_max_size = 530M
max_file_uploads = 5
date.timezone = UTC
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = off
